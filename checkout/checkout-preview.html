<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lyndco Checkout — Test Preview</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f7f6f2;color:#202b33;margin:0}main{max-width:480px;margin:25px auto;padding:20px}section{background:white;border:1px solid #e4e5e2;padding:24px;border-radius:18px}h1{color:#163a43;font-size:27px}label{display:block;margin:13px 0}input[type=email],select{width:100%;font:inherit;padding:12px;border:1px solid #a4b0b4;border-radius:9px}button{width:100%;padding:15px;background:#163a43;color:white;border:0;border-radius:10px;font-weight:800;font-size:16px}button:disabled{opacity:.5}small{color:#59656c}fieldset{border:0;border-top:1px solid #e4e5e2;margin:20px 0;padding:15px 0}legend{font-weight:800}.notice{background:#fff2d6;border-radius:10px;padding:12px}</style></head><body><main><section><p class="notice"><strong>Development preview.</strong> Payments are disabled until incorporation, legal review and technical verification.</p><h1>Choose your Lyndco tool</h1><label>Edition<select id="edition"><option value="standard">Standard — £39</option><option value="custom">Custom — £59</option></select></label><label>Additional user licences (£15 each)<select id="seats"></select></label><label>Your email<input id="email" type="email" placeholder="you@business.co.uk" autocomplete="email"></label><p><strong>One-off total: <span id="total">£39</span></strong></p><fieldset><legend>Before downloading</legend><label><input type="checkbox" id="terms"> I agree to the Terms of Sale and Software Licence (links pending legal review).</label><label><input type="checkbox" id="immediate"> I expressly request supply of the digital software immediately after purchase.</label><label><input type="checkbox" id="cancel"> I understand that once digital supply begins, I lose the 14-day change-of-mind cancellation right. My rights if the software is faulty remain.</label></fieldset><fieldset><legend>What would help your business next? (optional)</legend><div id="interests"></div><label><input type="checkbox" id="marketing"> Email me about relevant future Lyndco products. I can unsubscribe any time.</label></fieldset><button disabled>Secure checkout — not yet enabled</button><p id="status"><small>Prototype only: no customer information is sent anywhere.</small></p></section></main><script>
const features=[['time','Time recording'],['assets','Asset tracking'],['reviews','Customer reviews'],['bookings','Bookings'],['profit','Profit analysis'],['expenses','Expenses'],['scheduling','Job scheduling']];
document.getElementById('interests').replaceChildren(...features.map(([value,label])=>{const l=document.createElement('label'),i=document.createElement('input');i.type='checkbox';i.value=value;l.append(i,' '+label);return l}));
for(let n=0;n<=20;n++){const op=document.createElement('option');op.value=n;op.textContent=String(n);document.getElementById('seats').append(op)}
function recalc(){let base=document.getElementById('edition').value==='standard'?39:59;document.getElementById('total').textContent='£'+(base+15*Number(document.getElementById('seats').value));}
document.getElementById('edition').addEventListener('change',recalc);document.getElementById('seats').addEventListener('change',recalc);
</script></body></html>
